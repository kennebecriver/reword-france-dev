<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Reword Mini</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

    <div id="view-loading" class="view active">
        <div class="loader-container">
            <div class="loader"></div>
            <p id="loading-msg" style="margin-top: 20px; color: var(--text-muted)">Loading decks...</p>
        </div>
    </div>

    <div id="view-topics" class="view">
        <div class="header">My decks</div>
        <div id="topics-grid" class="topics-grid"></div>
    </div>

    <!-- Study deck: shell mounted from `#deck-shell-template` (see bootstrap.js). -->
    <div id="view-deck" class="view deck-view-root"></div>
    <!-- Dictation: same shell, different `#card-stage` + engine bindings. -->
    <div id="view-deck-dictation" class="view deck-view-root"></div>
    <!-- Listen: same shell; card shows t2, t1 under eye. -->
    <div id="view-deck-listen" class="view deck-view-root"></div>

    <template id="deck-shell-template">
        <div class="deck-shell">
            <div class="header">
                <button type="button" class="back-btn deck-back-btn" aria-label="Back">✕</button>
                <h1 class="deck-shell-title"></h1>
                <div class="header-controls">
                    <span class="deck-shell-counter"></span>
                    <button type="button" class="onair-btn deck-onair-btn" title="Auto-play mode">▶</button>
                    <button type="button" class="onair-btn deck-onair-fr-btn" title="French only">🇫🇷</button>
                </div>
            </div>

            <div class="deck-card-stage"></div>

            <div class="footer">
                <button type="button" class="action-btn btn-done deck-btn-done">Done</button>
                <button type="button" class="action-btn btn-play deck-btn-play">Play</button>
                <button type="button" class="action-btn btn-repeat deck-btn-repeat">Repeat</button>
            </div>
            <div class="play-status deck-play-status">Ready</div>
            <div class="toggle-wrapper">
                <label class="toggle-switch">
                    <input type="checkbox" class="deck-auto-play-toggle">
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label">Auto-play</span>
                <label class="toggle-switch" style="margin-left: 14px;">
                    <input type="checkbox" class="deck-gemini-toggle">
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label">Gemini</span>
                <label class="toggle-switch deck-reveal-primary-toggle-wrapper" style="margin-left: 14px; display: none;">
                    <input type="checkbox" class="deck-reveal-primary-toggle">
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label deck-reveal-primary-toggle-label" style="display: none;">Hide Primary</span>
                <label class="toggle-switch deck-reveal-toggle-wrapper" style="margin-left: 14px; display: none;">
                    <input type="checkbox" class="deck-reveal-toggle">
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label deck-reveal-toggle-label" style="display: none;">Hide Secondary</span>
            </div>
        </div>
    </template>

    <script type="module" src="./src/bootstrap.js"></script>
</body>
</html>
