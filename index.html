<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Reword Mini</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

    <div id="view-loading" class="view active">
        <div class="loader-container">
            <div class="loader"></div>
            <p id="loading-msg" style="margin-top: 20px; color: var(--text-muted)">Loading decks...</p>
        </div>
    </div>

    <div id="view-topics" class="view">
        <div class="header">My decks</div>
        <div id="topics-grid" class="topics-grid"></div>
    </div>

    <div id="view-deck" class="view">
        <div class="header">
            <button class="back-btn" onclick="showView('topics')">✕</button>
            <h1 id="deck-title">---</h1>
            <div class="header-controls">
                <span id="deck-counter">0</span>
                <button class="shuffle-btn" id="shuffle-btn" title="Shuffle deck">☠</button>
            </div>
        </div>
        
        <div id="card-stage"></div>

        <div class="footer">
            <button class="action-btn btn-done" onclick="Engine.manualSwipe('left')">Done</button>
            <button class="action-btn btn-play" onclick="Engine.playActiveCard()">Play</button>
            <button class="action-btn btn-repeat" onclick="Engine.manualSwipe('right')">Repeat</button>
        </div>
        <div id="play-status" class="play-status">Ready</div>
        <!-- Auto-play Toggle -->
        <div class="toggle-wrapper">
            <label class="toggle-switch">
                <input type="checkbox" id="auto-play-toggle">
                <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label">Auto-play</span>
            <label class="toggle-switch" style="margin-left: 14px;">
                <input type="checkbox" id="gemini-mode-toggle">
                <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label">Gemini</span>
        </div>
    </div>

    <script type="module" src="./src/bootstrap.js"></script>
</body>
</html>
