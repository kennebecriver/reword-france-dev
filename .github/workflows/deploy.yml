name: Deploy GitHub Pages

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy_page:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GEMINI_TTS folder
        run: |
          mkdir -p GEMINI_TTS
          cp -r ./* GEMINI_TTS/ 2>/dev/null || true
          rm -rf GEMINI_TTS/GEMINI_TTS 2>/dev/null || true
          ls -la GEMINI_TTS
          find GEMINI_TTS -type f | wc -l

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'GEMINI_TTS'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
